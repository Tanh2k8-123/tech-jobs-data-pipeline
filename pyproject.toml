[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sea-it-jobs-pipeline"
version = "0.1.0"
description = "Daily Vietnam IT job market pipeline on Databricks"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
  "pyarrow>=18,<24",
  "databricks-sdk>=0.72,<1",
  "dbt-databricks>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "duckdb>=1.4,<2", "sqlglot>=27,<31"]

[project.scripts]
it-jobs = "sea_it_jobs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sea_it_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
