name: vn_it_jobs
version: '1.0.0'
config-version: 2
profile: vn_it_jobs
model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
vars:
  catalog: workspace
  schema_prefix: vn_jobs
  enable_liquid_clustering: true
models:
  vn_it_jobs:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
seeds:
  vn_it_jobs:
    +schema: silver
